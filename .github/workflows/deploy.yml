name: Deploy to Azure Static Web Apps

# Every push to main publishes houseofmarka.com. Also runnable by hand from the
# Actions tab ("Run workflow") to redeploy without a code change.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one production deploy at a time; a newer push waits rather than racing.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  id-token: write # lets Azure verify this run via GitHub's OIDC token — no stored secrets
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build

      # Signs in as the managed identity "id-github-houseofmarka-deploy", which
      # trusts only pushes to MarkaTech/houseofmarka@main and can only manage
      # the Static Web App. The IDs are repository *variables*, not secrets.
      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch deployment token
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_SWA_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "SWA_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy ./out to production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: out
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test
        run: |
          for path in / /services/ /insights/ /apps/ /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://houseofmarka.com$path")
            echo "$path -> $code"
            test "$code" = 200
          done
